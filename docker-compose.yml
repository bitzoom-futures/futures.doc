name: www_web

# 环境变量（在 Dokploy 项目的 Environment Variables 中设置）：
#   ENV    = test | staging | prod
#   DOMAIN = test.riverwa.com | staging.riverwa.com | riverwa.com

services:
  web-www:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-riverwa.com}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-www-${ENV:-test}.rule=Host(`${DOMAIN:-test.riverwa.com}`)"
      - "traefik.http.routers.web-www-${ENV:-test}.entrypoints=websecure"
      - "traefik.http.routers.web-www-${ENV:-test}.tls=true"
      - "traefik.http.routers.web-www-${ENV:-test}.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-www-${ENV:-test}.loadbalancer.server.port=80"
      - "traefik.http.routers.web-www-${ENV:-test}.tls.certresolver=letsencrypt"
    networks:
      - dokploy-network
      - infra-network

networks:
  dokploy-network:
    external: true
  infra-network:
    external: true
