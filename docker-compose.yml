name: doc_web

# 文档站内网服务，通过 test-www 的 nginx 反代 /docs 路由访问
# 不对外暴露 Traefik 路由，仅在 infra-network 内网可达

services:
  web-doc:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: web-doc
    restart: unless-stopped
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-riverwa.com}
    networks:
      - dokploy-network
      - infra-network

networks:
  dokploy-network:
    external: true
  infra-network:
    external: true
